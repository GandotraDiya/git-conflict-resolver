<!-- templates/index.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Call AI Agent — Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 32px; }
    input[type="tel"] { width: 300px; padding: 6px; }
    button { padding: 8px 14px; }
    .status { margin-top: 12px; color: #333; }
    .transcripts { margin-top: 20px; }
    pre { background:#f5f5f5; padding:10px; border-radius:6px; }
  </style>
</head>
<body>
  <h1>Call AI Agent</h1>

  <form id="callForm">
    <label for="phone">Your phone number (E.164):</label><br>
    <input id="phone" type="tel" placeholder="+919876543210" required><br><br>
    <button type="submit">Call Me</button>
  </form>

  <div class="status" id="status"></div>

  <div class="transcripts">
    <h3>Recent calls</h3>
    <button id="refreshCalls">Refresh</button>
    <div id="callsList"></div>
  </div>

<script>
async function startCall(phone) {
  const res = await fetch("/start-call", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ phone })
  });
  const j = await res.json();
  return j;
}

document.getElementById("callForm").onsubmit = async (e) => {
  e.preventDefault();
  const phone = document.getElementById("phone").value;
  document.getElementById("status").innerText = "Starting call...";
  try {
    const result = await startCall(phone);
    document.getElementById("status").innerText = JSON.stringify(result);
    await fetchCalls();
  } catch(err) {
    document.getElementById("status").innerText = "Error: " + err;
  }
};

async function fetchCalls() {
  const res = await fetch("/calls");
  const list = await res.json();
  const container = document.getElementById("callsList");
  container.innerHTML = "";
  for (const c of list) {
    const div = document.createElement("div");
    div.innerHTML = `<strong>Call SID:</strong> ${c.call_sid} — <strong>to</strong> ${c.to_number} — <button data-sid="${c.call_sid}">View Transcript</button>`;
    container.appendChild(div);
  }

  // attach view buttons
  container.querySelectorAll("button[data-sid]").forEach(btn => {
    btn.onclick = async () => {
      const sid = btn.dataset.sid;
      const res = await fetch("/transcripts/" + sid);
      const items = await res.json();
      const pretty = items.map(x => `${x.ts} [${x.role}] ${x.text}`).join("\n\n");
      alert(pretty || "No transcript yet");
    };
  });
}

document.getElementById("refreshCalls").onclick = fetchCalls;

fetchCalls();
</script>
</body>
</html>
